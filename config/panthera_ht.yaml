# drag_teleop 控制器配置（双臂 Panthera HT）
#
# 本文件为 controller_manager 与控制器的完整参数。
# 启动入口：launch/drag_teleop_controller.launch.py（会按 type/hardware 覆盖 joints 等参数）。
#
# "/*" 匹配任意 namespace 下的节点，如 "/drag_teleop/controller_manager" 匹配 "/*/controller_manager"，
# 但无 namespace 时（/controller_manager 仅 1 个 token）会匹配失败，
# 因此统一使用 /** 以兼容两种场景。
/**:
  controller_manager:
    ros__parameters:
      update_rate: 500  # Hz，与描述包 dual.yaml 保持一致

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      drag_teleop_controller:
        type: drag_teleop_controller/DragTeleopController
  drag_teleop_controller:
    ros__parameters:
      # 重力补偿关节（12 个臂关节，URDF 顺序）
      joints:
        - left_joint1
        - left_joint2
        - left_joint3
        - left_joint4
        - left_joint5
        - left_joint6
        - right_joint1
        - right_joint2
        - right_joint3
        - right_joint4
        - right_joint5
        - right_joint6
      # 仅位置保持关节（夹爪平移关节，无电机力矩接口）
      hold_joints:
        - left_gripper_joint
        - right_gripper_joint
      # 力矩限幅（Nm），与 robot.xacro hardware 段 max_torques（每臂前 6 值）一致；留空则不限幅
      max_effort: [21.0, 36.0, 36.0, 21.0, 10.0, 10.0,
                  21.0, 36.0, 36.0, 21.0, 10.0, 10.0]
      # 世界系重力加速度（双臂 body_rpy 非零时需按安装方向旋转）
      gravity_vector: [0.0, 0.0, -9.81]
      # URDF 来源参数（controller_manager 注入 / /controller_manager 参数）
      urdf_param: robot_description

      # ---- 力反馈（位置弹簧）----
      # 从臂碰撞跟不上主臂时，把主臂位置命令反向偏移 Δq，电机位置环
      # 产生 kp·Δq 的阻力（操作者往碰撞方向推会感到回推）。
      # 控制器订阅 mapper 逆映射发布的期望位置（主臂参考系 q_ref，话题
      # /joint_mapper/feedback_joint_state），误差 e = q_master − q_ref
      # 超过死区后 Δq = −gain·(e−δ)，经 max_delta_q 限幅与 delta_q_rate
      # 斜坡平滑（防位置命令跳变）。feedback.kp 仅在反馈激活期间临时提升
      # 硬件 joint_kp（退出自动恢复原值），kp·Δq 即反馈力矩
      # （如 kp=4 × Δq=0.5 = 2Nm ≪ 21/36Nm 限幅）。
      feedback:
        enabled: false
        joint_state_topic: /joint_mapper/feedback_joint_state
        input_timeout: 0.2   # 秒；反馈话题超时则自动关闭反馈（不提升 kp）
        gain: 0.3            # Δq = −gain·(e−δ)
        deadzone: 0.02       # 死区 rad，抵消主从静态误差
        kp: 4.0              # 反馈激活期间硬件 joint_kp 临时值
        kd: 0.0              # <=0 表示不改 kd
        kp_param_name: joint_kp  # 硬件 kp 参数名（不同 hardware 可能不同，支持 array 或标量）
        kd_param_name: joint_kd  # 硬件 kd 参数名
        max_delta_q: 0.5     # Δq 限幅 rad
        delta_q_rate: 2.0    # Δq 斜坡速率 rad/s
